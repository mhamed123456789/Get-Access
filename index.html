<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Access - Brand</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Animated Glow Effects */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 193, 7, 0.1);
            filter: blur(120px);
            border-radius: 50%;
            z-index: 1;
            animation: float 6s ease-in-out infinite alternate;
        }

        .container {
            text-align: center;
            z-index: 2;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
            color: #ffffff;
            animation: fadeInDown 1s ease-out;
            line-height: 1.4;
        }

        /* Glowing Button Styles */
        .get-access-btn {
            display: inline-block;
            padding: 18px 45px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #0b0b0b;
            background-color: #ffc107;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.6);
            animation: pulseGlow 2s infinite, fadeInUp 1s ease-out;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .get-access-btn:hover {
            transform: scale(1.08);
            background-color: #ffca2c;
            box-shadow: 0 0 35px rgba(255, 193, 7, 0.9);
        }

        .price-tag {
            margin-top: 25px;
            font-size: 1.2rem;
            color: #888;
            animation: fadeIn 1.5s ease-out;
        }

        .price-tag span {
            color: #ffc107;
            font-weight: bold;
        }

        /* Animations */
        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px rgba(255, 193, 7, 0.5);
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 193, 7, 0.9), 0 0 50px rgba(255, 193, 7, 0.4);
            }
            100% {
                box-shadow: 0 0 15px rgba(255, 193, 7, 0.5);
            }
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <h1>To Get Access Site Web Design Brand Click Botoun</h1>
        
        <!-- WhatsApp Button with formatted & organized message -->
        <a href="https://wa.me/21690576380?text=%F0%9F%91%8B%20Salem,%20nhb%20nchry%20access!%0A%0A%F0%9F%92%BB%20Service:%20Site%20Web%20Design%20Brand%0A%F0%9F%92%B0%20Price:%2030%20DT" 
           class="get-access-btn" 
           target="_blank">
           GET ACCESS
        </a>

        <div class="price-tag">Price: <span>30 DT</span></div>
    </div>

</body>
</html>
